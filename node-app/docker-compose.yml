services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: notesdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  webapp:
    build: .
    restart: unless-stopped
    environment:
      PORT: "5000"
      DATABASE_URL: "postgresql://dbuser:dbpassword@db:5432/notesdb"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webapp_network
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
    networks:
      - webapp_network

volumes:
  postgres_data:

networks:
  webapp_network:
    driver: bridge
